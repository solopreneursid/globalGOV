name: globalgov

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-globalgov}
      POSTGRES_USER: ${POSTGRES_USER:-globalgov}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-globalgov} -d ${POSTGRES_DB:-globalgov}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      PUBLIC_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-globalgov}
      PGUSER: ${POSTGRES_USER:-globalgov}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGSSLMODE: disable
      DOCUMENT_STORE_DIR: /var/lib/globalgov/documents
    expose: ["8080"]
    volumes:
      - globalgov_documents:/var/lib/globalgov/documents
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/internal/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend, data]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "self-hosted-scheduler.mjs"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-globalgov}
      PGUSER: ${POSTGRES_USER:-globalgov}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGSSLMODE: disable
      DOCUMENT_STORE_DIR: /var/lib/globalgov/documents
    volumes:
      - globalgov_documents:/var/lib/globalgov/documents
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks: [backend, data]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "self-hosted-migrate.mjs"]
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-globalgov}
      PGUSER: ${POSTGRES_USER:-globalgov}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGSSLMODE: disable
    networks: [data]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    depends_on: [app]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend, edge]

networks:
  backend:
  data:
    internal: true
  edge:

volumes:
  postgres_data:
  globalgov_documents:
  caddy_data:
  caddy_config:
