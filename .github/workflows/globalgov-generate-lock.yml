name: Generate globalGOV runtime lockfile
on:
  push:
    branches: [infra/node-postgres-runtime]
    paths:
      - 'apps/govexam-radar/package.json'
      - '.github/workflows/globalgov-generate-lock.yml'
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile
        working-directory: apps/govexam-radar
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/govexam-radar/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already current."
            exit 0
          fi
          git commit -m "chore: lock self-hosted PostgreSQL runtime dependency"
          git push origin "HEAD:${GITHUB_REF_NAME}"
