name: globalGOV independent source health monitor
on:
  schedule:
    - cron: '10 2,8,14,20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/globalgov-source-monitor.yml'
permissions:
  contents: read
concurrency:
  group: globalgov-independent-monitor
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical service and live source freshness
        shell: bash
        run: |
          set +e
          node apps/govexam-radar/launch-monitor.mjs https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev > globalgov-monitor.json
          result=$?
          cat globalgov-monitor.json
          printf '### Independent globalGOV monitor\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat globalgov-monitor.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Preserve check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globalgov-monitor-report
          path: globalgov-monitor.json
          retention-days: 14
          if-no-files-found: error
  incident:
    needs: inspect
    if: ${{ failure() && needs.inspect.result == 'failure' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'globalGOV monitoring incident: canonical staging';
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            });
            if (open.some(i => !i.pull_request && i.title === title)) {
              core.info('Existing incident retained; no duplicate notification.');
              return;
            }
            await github.rest.issues.create({
              ...context.repo, title,
              body: 'An independent globalGOV health check failed. Review the run and its bounded JSON evidence: https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + '\n\nNo application changes or automatic issue closure performed. Known SSB restriction: #3.'
            });
