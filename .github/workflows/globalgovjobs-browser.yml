name: GlobalGovJobs supported-browser checks
on:
  push:
    branches:
      - feat/govradar-phase1-sources-20261116
    paths:
      - 'apps/govexam-radar/**'
      - '.github/workflows/globalgovjobs-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/govexam-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runtime
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install supported Chromium runtime
        run: npx playwright install --with-deps chromium
      - name: Run responsive, accessibility and saved-data browser checks
        run: node --test browser.test.mjs
