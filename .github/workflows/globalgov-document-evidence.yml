name: globalGOV document evidence checks
# External source probes are intentionally disabled until they use the owner-reviewed database policy registry.
on:
  pull_request:
    paths:
      - 'apps/govexam-radar/recruitment-*.mjs'
      - 'apps/govexam-radar/reviewed-*.mjs'
      - 'apps/govexam-radar/review-sign*.mjs'
      - 'apps/govexam-radar/encrypted-backup*.mjs'
      - 'apps/govexam-radar/d1-export-backup*.mjs'
      - '.github/workflows/globalgov-document-evidence.yml'
  push:
    branches: [main]
    paths:
      - 'apps/govexam-radar/recruitment-*.mjs'
      - 'apps/govexam-radar/reviewed-*.mjs'
      - 'apps/govexam-radar/review-sign*.mjs'
      - 'apps/govexam-radar/encrypted-backup*.mjs'
      - 'apps/govexam-radar/d1-export-backup*.mjs'
      - '.github/workflows/globalgov-document-evidence.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 5,17 * * *'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Poppler for synthetic PDF round trip
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils sqlite3
      - name: Verify extraction, source boundaries, eligibility and encrypted restore
        run: node --test apps/govexam-radar/usajobs-probe.test.mjs apps/govexam-radar/review-sign.test.mjs apps/govexam-radar/reviewed-catalog.test.mjs apps/govexam-radar/recruitment-evidence.test.mjs apps/govexam-radar/recruitment-post-tables.test.mjs apps/govexam-radar/recruitment-events.test.mjs apps/govexam-radar/recruitment-ledger.test.mjs apps/govexam-radar/encrypted-backup.test.mjs apps/govexam-radar/d1-export-backup.test.mjs apps/govexam-radar/recruitment-pdf.test.mjs
