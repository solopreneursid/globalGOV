name: globalGOV USAJOBS historical live smoke
on:
  push:
    branches: [main]
    paths:
      - 'apps/govexam-radar/usajobs-history.mjs'
      - 'apps/govexam-radar/usajobs-history-live-smoke.mjs'
      - '.github/workflows/globalgov-usajobs-history-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify live staging and unauthenticated USAJOBS endpoints
        run: node apps/govexam-radar/usajobs-history-live-smoke.mjs
