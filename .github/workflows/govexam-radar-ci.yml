name: globalGOV checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/govexam-radar/**'
      - '.github/workflows/govexam-radar-ci.yml'
      - 'infra/self-hosted/**'
      - 'docs/architecture/**'
      - 'README.md'
      - 'MIGRATION.md'
      - 'Dockerfile.backup'
      - 'compose.yaml'
      - 'backup.env.example'
  pull_request:
    paths:
      - 'apps/govexam-radar/**'
      - '.github/workflows/govexam-radar-ci.yml'
      - 'infra/self-hosted/**'
      - 'docs/architecture/**'
      - 'README.md'
      - 'MIGRATION.md'
      - 'Dockerfile.backup'
      - 'compose.yaml'
      - 'backup.env.example'
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/govexam-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install locked runtime dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit and API tests
        run: npm test
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/govexam-radar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Install locked runtime and matching browser driver
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
      - name: Browser tests at phone, tablet, and desktop widths
        run: node --test browser.test.mjs uk-release-browser.test.mjs
      - name: Save test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: govradar-responsive-previews
          path: apps/govexam-radar/govradar-*.png
          if-no-files-found: ignore
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check canonical Cloudflare staging deployment
        run: |
          curl --fail --show-error --silent --max-time 25 https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/health | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.status!=="ok"||d.version!=="2.7.0-preview")process.exit(1);console.log("Full-parity preview health verified",d.version);})'
          curl --fail --show-error --silent --max-time 25 https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/source-status | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.total!==60||!Array.isArray(d.sources)||d.verifiedVacancies!==0)process.exit(1);console.log("Scheduled status catalog verified",d.total);})'
          curl --fail --show-error --silent --max-time 25 --retry 1 "https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/check?id=upsc" | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.sourceId!=="upsc"||!["reachable","restricted","unconfirmed"].includes(d.status))process.exit(1);console.log("Real on-demand source check:",d.status);})'
          curl --fail --show-error --silent --max-time 25 https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/source-status | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const d=JSON.parse(s);if(d.total!==60||d.checkedSources<1)process.exit(1);console.log("Persisted source check evidence:",d.checkedSources);})'

      - name: Verify simplified staging preview
        run: |
          node --input-type=module <<'NODE'
          const base='https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev';
          const [page,script,api,lite,liteScript]=await Promise.all([
            fetch(base+'/?v=plain-ui-20261125'),
            fetch(base+'/official.js?v=plain-ui-20261125'),
            fetch(base+'/api/notices?limit=1'),
            fetch(base+'/lite?v=plain-ui-20261125'),
            fetch(base+'/lite.js?v=2.7.2')
          ]);
          if(!page.ok||!script.ok||!api.ok||!lite.ok||!liteScript.ok)throw Error('preview_http_failure');
          const html=await page.text(),js=await script.text(),notices=await api.json(),liteHtml=await lite.text(),liteJs=await liteScript.text();
          for(const text of ['Find government jobs easily.','Job websites','gg-region-help','gg-language'])
            if(!html.includes(text))throw Error('preview_page_missing_'+text);
          for(const text of ['Government job notices','Check the official notice before you apply','No notices found'])
            if(!js.includes(text))throw Error('preview_script_missing_'+text);
          if(!Array.isArray(notices.notices))throw Error('preview_notices_unavailable');
          if(!liteHtml.includes('/lite.js?v=2.7.2'))throw Error('low_data_script_version_missing');
          new Function(liteJs);
          console.log('Simplified preview, low-data script syntax and official-notice API verified');
          NODE

      - name: Verify public preview source and community boundaries
        run: |
          node --input-type=module <<'NODE'
          const origin='https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev';
          const paths=['/api/notices?limit=50','/api/notices?country=India','/api/notices?country=Australia','/api/notices?source=manitoba-jobs','/api/notice-changes?limit=30','/api/ingestion-status','/privacy','/terms'];
          const responses=await Promise.all(paths.map(path=>fetch(origin+path,{cache:'no-store'})));
          if(responses.some((r,i)=>r.status!==(i===3?403:200)))throw Error('unexpected status');
          const [all,india,australia,deny,changes,status]=await Promise.all(responses.slice(0,6).map(x=>x.json()));
          const permitted=new Set(['uk-dfe-teaching-vacancies','india-isro-opportunities','india-ssb-recruitment']);
          for(const x of [all,india,australia]){
            if(x.releaseProfile!=='approved_staging'||x.publicLaunchAuthorized!==false||!Array.isArray(x.sources)||!x.sources.some(s=>s.id==='uk-dfe-teaching-vacancies')||x.sources.some(s=>!permitted.has(s.id)||s.commercialReuseApprovedForCurrentFields!==true)||x.notices.some(n=>!permitted.has(n.sourceId))||typeof x.indiaSourceCheck?.ready!=='boolean')throw Error('unapproved source returned');
            if(!x.indiaSourceCheck.ready&&(x.sources.some(s=>s.id==='india-isro-opportunities')||x.notices.some(n=>n.sourceId==='india-isro-opportunities')))throw Error('unchecked ISRO data exposed');
          }
          if(india.filters.country!=='India'||india.notices.some(n=>!['india-isro-opportunities','india-ssb-recruitment'].includes(n.sourceId))||australia.total!==0||deny.error!=='source_not_approved_for_release_preview')throw Error('location or source filter failed');
          if(changes.changes.some(x=>!permitted.has(x.sourceId))||status.bySource.some(x=>!permitted.has(x.sourceId)))throw Error('secondary feed leaked a source');
          const privacy=await responses[6].text(),terms=await responses[7].text();
          if(!privacy.includes('connect@yorphives.com')||!terms.includes('Open Government Licence'))throw Error('policies missing');
          const paused=await fetch(origin+'/api/community/register',{method:'POST'});
          if(paused.status!==503||(await paused.json()).error!=='community_paused')throw Error('community not paused');
          console.log('Source rights, India checks, Australia filter, privacy and paused community verified');
          NODE

      - name: Verify legacy API scope restriction on canonical staging
        run: |
          node --input-type=module <<'NODE'
          const origin='https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev';
          const [page,css,js,allow,deny,canada,bypass]=await Promise.all([
           fetch(origin+'/release-preview'),
           fetch(origin+'/release-preview.css'),
           fetch(origin+'/release-preview.js'),
           fetch(origin+'/api/release-preview/notices?limit=30'),
           fetch(origin+'/api/release-preview/notices?source=manitoba-jobs'),
           fetch(origin+'/api/release-preview/notices?country=Canada'),
           fetch(origin+'/api/release-preview/notices?scope=research')
          ]);
          if([page,css,js,allow,canada,bypass].some(r=>r.status!==200)||deny.status!==403)
           throw Error('release_preview_http_contract_failed');
          const html=await page.text(),style=await css.text(),script=await js.text();
          if(!html.includes('RELEASE CANDIDATE')||!html.includes('OFFICIAL-SOURCE SNAPSHOT')||!html.includes('id="preview-grid"')||
             !page.headers.get('x-robots-tag')?.includes('noindex')||
             !style.includes('@media(max-width:700px)')||
             !script.includes('/api/release-preview/notices'))throw Error('staged_uk_preview_assets_missing');
          const approved=await allow.json(),excluded=await deny.json(),empty=await canada.json(),params=await bypass.json();
          for(const dataset of [approved,empty,params]){
           if(dataset.releaseProfile!=='uk_only_release_preview'||dataset.publicLaunchAuthorized!==false||
              dataset.sources?.length!==1||dataset.sources[0]?.id!=='uk-dfe-teaching-vacancies'||
              dataset.sources[0]?.commercialReuseApprovedForCurrentFields!==true||
              !Array.isArray(dataset.notices)||dataset.notices.some(x=>x.sourceId!=='uk-dfe-teaching-vacancies'))
             throw Error('release_preview_source_scope_failure');
          }
          if(!Number.isSafeInteger(approved.total)||approved.total<0||empty.notices.length!==0||
              excluded.error!=='source_not_approved_for_release_preview')
           throw Error('release_preview_filtered_query_failure');
          console.log('UK-only staged preview HTTP, rights scope, responsive assets and query isolation verified',approved.total);
          NODE

      - name: Verify current UK source ingestion
        run: |
          node --input-type=module <<'NODE'
          const response=await fetch('https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev/api/ingestion-status');
          const d=await response.json(),a=d.automation||{},s=a.sources||[];
          const uk=s.find(x=>x.sourceId==='uk-dfe-teaching-vacancies');
          if(!response.ok||!uk?.scheduledSuccessObserved||typeof a.healthy!=='boolean'||typeof d.indiaSourceCheck?.ready!=='boolean')throw Error('Source status unavailable');
          console.log('UK source status and scheduled provenance available',a.healthy);
          NODE

      - name: Verify portable collector disabled by default and read-only source plan
        run: |
          node -e 'const origin="https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev";Promise.all([fetch(origin+"/api/collector/plan"),fetch(origin+"/api/collector/ingest",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})]).then(async([a,b])=>{if(a.status!==200||![401,415,503].includes(b.status))process.exit(1);const x=await a.json();if(!Array.isArray(x.sources)||x.sources.length!==2)process.exit(1);console.log("Read-only plan working, unauthenticated mutation denied",b.status);}).catch(()=>process.exit(1));'

      - name: Read-only official Manitoba province RSS compatibility probe
        run: node apps/govexam-radar/probe-manitoba.mjs

      - name: Read-only India Employment News source/robots compatibility probe
        continue-on-error: true
        run: node apps/govexam-radar/probe-india.mjs

      - name: Read-only SSB access and robots probe
        continue-on-error: true
        run: node apps/govexam-radar/probe-ssb.mjs

      - name: Read-only ISRO access and robots probe
        continue-on-error: true
        run: node apps/govexam-radar/probe-isro.mjs

  postgres-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Start isolated PostgreSQL 17
        run: |
          docker run -d --name globalgov-schema-test \
            -e POSTGRES_USER=globalgov \
            -e POSTGRES_PASSWORD=globalgov-ci-only \
            -e POSTGRES_DB=globalgov \
            -p 5432:5432 postgres:17-alpine
          for attempt in $(seq 1 30); do
            if docker exec globalgov-schema-test pg_isready -U globalgov -d globalgov; then
              exit 0
            fi
            sleep 2
          done
          docker logs globalgov-schema-test
          exit 1
      - name: Apply PostgreSQL target schema
        run: |
          docker exec -i globalgov-schema-test \
            psql -U globalgov -d globalgov -v ON_ERROR_STOP=1 \
            < infra/self-hosted/postgres/001_core.sql
      - name: Verify schema objects and revision trigger
        run: |
          docker exec -i globalgov-schema-test \
            psql -U globalgov -d globalgov -v ON_ERROR_STOP=1 \
            < infra/self-hosted/postgres/001_core.test.sql
      - name: Apply first-party operations and evidence schema
        run: |
          docker exec -i globalgov-schema-test \
            psql -U globalgov -d globalgov -v ON_ERROR_STOP=1 \
            < infra/self-hosted/postgres/002_first_party_operations.sql
      - name: Install locked PostgreSQL driver
        working-directory: apps/govexam-radar
        run: npm ci --no-audit --no-fund
      - name: Run live PostgreSQL adapter integration tests
        working-directory: apps/govexam-radar
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: globalgov
          PGUSER: globalgov
          PGPASSWORD: globalgov-ci-only
        run: node --test postgres-d1.integration.test.mjs
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          cp backup.env.example .env.backup
          docker compose config --quiet
      - name: Build self-hosted runtime image
        run: docker build --tag globalgov:self-hosted-ci .
      - name: Build isolated encrypted backup image
        run: docker build --file Dockerfile.backup --tag globalgov:backup-ci .
      - name: Remove isolated PostgreSQL
        if: always()
        run: docker rm -f globalgov-schema-test || true

  migration-rehearsal:
    # Uses synthetic fixtures only. No Cloudflare credentials or real D1 export.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: globalgov-ci-rehearsal
    steps:
      - uses: actions/checkout@v4
      - name: Check remote bootstrap shell syntax
        run: bash -n infra/self-hosted/bootstrap.sh
      - name: Prepare disposable configuration and private fixture
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cp .env.example .env
          sed -i 's/^PUBLIC_DOMAIN=.*/PUBLIC_DOMAIN=localhost/;s/^POSTGRES_DB=.*/POSTGRES_DB=globalgov_ci_rehearsal/;s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-admin/;s/^APP_DB_PASSWORD=.*/APP_DB_PASSWORD=ci-only-app/;s/^BACKUP_DB_PASSWORD=.*/BACKUP_DB_PASSWORD=ci-only-backup/;s/^RESTORE_TEST_DB_PASSWORD=.*/RESTORE_TEST_DB_PASSWORD=ci-only-restore/' .env
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          printf 'GLOBALGOV_BACKUP_KEY_HEX=%s\nBACKUP_REQUIRE_REMOTE=false\nBACKUP_REMOTE_TARGET=\nBACKUP_RETENTION_DAYS=14\n' "$key" > .env.backup
          mkdir -p "$RUNNER_TEMP/globalgov-fixture" secrets/ssh
          cp infra/self-hosted/fixtures/d1-rehearsal.sql "$RUNNER_TEMP/globalgov-fixture/export.sql"
          cp infra/self-hosted/fixtures/d1-uk-rehearsal.sql "$RUNNER_TEMP/globalgov-fixture/uk.sql"
          sudo chown -R 1000:1000 "$RUNNER_TEMP/globalgov-fixture"
          sudo chmod 700 "$RUNNER_TEMP/globalgov-fixture"
          sudo chmod 600 "$RUNNER_TEMP/globalgov-fixture/export.sql" "$RUNNER_TEMP/globalgov-fixture/uk.sql"
      - name: Build and initialize an empty isolated PostgreSQL deployment
        run: |
          docker compose config --quiet
          docker compose --profile tools build migrate app backup restore-scheduler
          docker compose up -d --wait postgres
          docker compose --profile tools run --rm --no-deps migrate
      - name: Encrypt, plan and apply the synthetic D1 export
        shell: bash
        run: |
          set -euo pipefail
          source .env.backup
          fixture="$RUNNER_TEMP/globalgov-fixture:/migration"
          docker compose --profile tools run --rm --no-deps -v "$fixture" -e GLOBALGOV_BACKUP_KEY_HEX="$GLOBALGOV_BACKUP_KEY_HEX" migrate node d1-export-backup.mjs encrypt /migration/export.sql /migration/export.enc
          docker compose --profile tools run --rm --no-deps -v "$fixture:ro" -e GLOBALGOV_BACKUP_KEY_HEX="$GLOBALGOV_BACKUP_KEY_HEX" migrate node postgres-import.mjs plan /migration/export.enc > "$RUNNER_TEMP/plan.json"
          jq -e '.state == "planned" and .writesPerformed == false and .tableCount == 12 and .totalRows == 12' "$RUNNER_TEMP/plan.json"
          docker compose --profile tools run --rm --no-deps -v "$fixture:ro" -e GLOBALGOV_BACKUP_KEY_HEX="$GLOBALGOV_BACKUP_KEY_HEX" -e GLOBALGOV_IMPORT_ALLOW_WRITE=true -e GLOBALGOV_IMPORT_CONFIRM_DATABASE=globalgov_ci_rehearsal migrate node postgres-import.mjs apply /migration/export.enc > "$RUNNER_TEMP/apply.json"
          jq -e '.state == "verified" and .writesPerformed == true and .tableCount == 12 and .totalRows == 12' "$RUNNER_TEMP/apply.json"
          jq -e -s '.[0].counts == .[1].counts and .[0].checksums == .[1].checksums' "$RUNNER_TEMP/plan.json" "$RUNNER_TEMP/apply.json"
          if docker compose --profile tools run --rm --no-deps -v "$fixture:ro" -e GLOBALGOV_BACKUP_KEY_HEX="$GLOBALGOV_BACKUP_KEY_HEX" -e GLOBALGOV_IMPORT_ALLOW_WRITE=true -e GLOBALGOV_IMPORT_CONFIRM_DATABASE=globalgov_ci_rehearsal migrate node postgres-import.mjs apply /migration/export.enc; then
            echo "Non-empty target was not rejected" >&2
            exit 1
          fi
      - name: Reconcile isolated UK snapshot without exposing archive to app
        shell: bash
        run: |
          set -euo pipefail
          source .env.backup
          fixture="$RUNNER_TEMP/globalgov-fixture:/migration"
          docker compose --profile tools run --rm --no-deps -v "$fixture" -e GLOBALGOV_BACKUP_KEY_HEX="$GLOBALGOV_BACKUP_KEY_HEX" migrate node d1-export-backup.mjs encrypt-uk /migration/uk.sql /migration/uk.enc
          docker compose --profile tools run --rm --no-deps -v "$fixture:ro" -e GLOBALGOV_BACKUP_KEY_HEX="$GLOBALGOV_BACKUP_KEY_HEX" migrate node postgres-import.mjs plan-uk /migration/uk.enc > "$RUNNER_TEMP/uk-plan.json"
          docker compose --profile tools run --rm --no-deps -v "$fixture:ro" -e GLOBALGOV_BACKUP_KEY_HEX="$GLOBALGOV_BACKUP_KEY_HEX" -e GLOBALGOV_IMPORT_ALLOW_WRITE=true -e GLOBALGOV_IMPORT_CONFIRM_DATABASE=globalgov_ci_rehearsal migrate node postgres-import.mjs apply-uk /migration/uk.enc > "$RUNNER_TEMP/uk-apply.json"
          jq -e '.state == "verified" and .tableCount == 4 and .totalRows == 4' "$RUNNER_TEMP/uk-apply.json"
          jq -e -s '.[0].counts == .[1].counts and .[0].checksums == .[1].checksums' "$RUNNER_TEMP/uk-plan.json" "$RUNNER_TEMP/uk-apply.json"
          docker compose exec -T postgres psql -U globalgov_admin -d globalgov_ci_rehearsal -v ON_ERROR_STOP=1 -Atc "SELECT NOT has_schema_privilege('globalgov_app','uk_archive','USAGE') AND has_schema_privilege('globalgov_backup','uk_archive','USAGE') AND (SELECT COUNT(*) FROM public.official_job_notices)=1 AND (SELECT COUNT(*) FROM uk_archive.official_job_notices)=1" | grep -qx t
      - name: Verify application using the restored database
        run: |
          docker compose up -d --wait app
          docker compose exec -T app node -e 'Promise.all(["/internal/ready","/api/health","/","/lite","/privacy","/terms"].map(async p=>{const r=await fetch("http://127.0.0.1:8080"+p);if(!r.ok)throw Error(p+": "+r.status)})).catch(e=>{console.error(e);process.exitCode=1})'
      - name: Create real encrypted database and document backups
        run: |
          docker compose run --rm --no-deps backup postgres-backup.mjs > "$RUNNER_TEMP/backup.json"
          jq -e '.state == "ok" and .archiveVerified == true and .documentArchiveVerified == true and .remoteCopyCompleted == false' "$RUNNER_TEMP/backup.json"
      - name: Restore the encrypted backup in a new isolated database
        run: |
          docker compose run --rm --no-deps restore-scheduler postgres-restore-test.mjs > "$RUNNER_TEMP/restore.json"
          jq -e '.state == "verified" and .temporaryDatabaseDropped == true and .documentArchiveVerified == true' "$RUNNER_TEMP/restore.json"
          jq -e -s '.[0].counts as $expected | .[1].counts as $actual | all($expected | to_entries[]; $actual[.key] == .value)' "$RUNNER_TEMP/apply.json" "$RUNNER_TEMP/restore.json"
          jq -e -s '.[0].counts == .[1].ukArchiveCounts' "$RUNNER_TEMP/uk-apply.json" "$RUNNER_TEMP/restore.json"
      - name: Destroy only disposable CI resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  nyc-public-source-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify NYC probe with synthetic fixtures
        run: node --test apps/govexam-radar/probe-nyc-open-data.test.mjs
      - name: Check official public API anonymously (research only)
        continue-on-error: true
        run: node apps/govexam-radar/probe-nyc-open-data.mjs
      - name: Verify complete bounded NYC snapshot and current-date normalization (research only)
        continue-on-error: true
        run: node apps/govexam-radar/probe-nyc-open-data.mjs --full

  hosted-baseline:
    # Read-only evidence about the already deployed preview; NOT proof that
    # this pull request's code is deployed, and never activates production.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - name: Verify existing hosted preview health and source scope without mutations
        run: |
          node --input-type=module <<'NODE'
          const origin="https://hqventures-govexam-parity-preview.solopreneursid-proy.workers.dev";
          const read=async path=>{const r=await fetch(origin+path,{redirect:"error",signal:AbortSignal.timeout(20000),cache:"no-store"});if(!r.ok)throw Error("hosted_http_"+r.status);return r.json();};
          const [health,notices,status]=await Promise.all([read("/api/health"),read("/api/notices?source=uk-dfe-teaching-vacancies&limit=1"),read("/api/ingestion-status")]);
          if(health.status!=="ok"||notices.publicLaunchAuthorized!==false||!Number.isSafeInteger(notices.total)||notices.total<1||notices.notices?.length!==1||notices.notices[0].sourceId!=="uk-dfe-teaching-vacancies")throw Error("hosted_baseline_contract_failed");
          const uk=status.automation?.sources?.find(x=>x.sourceId==="uk-dfe-teaching-vacancies");
          if(!uk?.scheduledSuccessObserved||!uk?.twoCycleNativeProof)throw Error("hosted_uk_native_cycles_unconfirmed");
          console.log(JSON.stringify({existingPreviewOnly:true,version:health.version,ukOpenNotices:notices.total,ukTwoCycleProof:uk.twoCycleNativeProof,candidateCodeDeployed:false}));
          NODE
